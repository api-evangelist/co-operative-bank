aid: co-operative-bank
url: https://raw.githubusercontent.com/api-evangelist/co-operative-bank/refs/heads/main/apis.yml
name: The Co-operative Bank
kind: company
description: >-
  The Co-operative Bank plc is a UK high-street retail and commercial bank,
  headquartered in Manchester and long known for its customer-led ethical
  banking policy. Following its 2013-2017 recapitalisation it was owned by
  institutional bondholders, and in January 2025 it completed its acquisition by
  Coventry Building Society, becoming part of the member-owned Coventry Building
  Society Group; it also operates the online-only "smile" brand. Authorised by
  the PRA and regulated by the FCA and PRA, it is an FCA-authorised ASPSP under
  PSD2 and the UK Open Banking regime. While it is not one of the nine
  CMA-mandated banks (CMA9), it implements the Open Banking Implementation
  Entity (OBIE) Read/Write API Standard (v3.1) and publishes a public developer
  portal at developer.co-operativebank.co.uk exposing Account Information (AIS),
  Payment Initiation (PIS), and Confirmation of Funds (CBPII) APIs for both the
  Co-operative Bank and smile brands, secured with FAPI-grade OAuth2/OIDC,
  mutual-TLS client authentication using Open Banking directory certificates,
  and PSD2 strong customer authentication, with a manual TPP onboarding process
  and a sandbox for testing before production.
