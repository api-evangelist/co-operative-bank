openapi: 3.2.0
info:
  title: dotCMS REST Bulk Upload API
  version: '3'
  description: Creating several assets in one background run
servers:
- url: /
  description: dotCMS Server
tags:
- name: Bulk Upload
  description: Creating several assets in one background run
paths:
  /api/v1/assets/_bulkupload:
    post:
      tags:
      - Bulk Upload
      summary: Create several assets from one upload, asynchronously
      description: 'Accepts several files plus a JSON `form` part naming the target and the base type, and answers `202` with a job handle **before the assets are created**. The work runs in the background: follow it with `GET /api/v1/jobs/{jobId}/status`, watch it with `GET /api/v1/jobs/{jobId}/monitor`, cancel it with `POST /api/v1/jobs/{jobId}/cancel`, and read the per-file outcome from the job''s result. The submitting author is notified on any terminal state, so the outcome survives them navigating away.


        One file failing does not abort the batch: every remaining file is still attempted, and each failure is reported by name with a machine-readable reason.'
      operationId: bulkUploadAssets
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FormDataMultiPart'
      responses:
        '202':
          description: Batch queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityBulkUploadSubmitView'
        '400':
          description: No files; malformed or missing `form`; unsupported base type; neither or both of folderId/siteId; more files than the configured maximum; request not same-origin; staging disabled
        '403':
          description: The author may not add children to the target
        '404':
          description: The target folder or site does not exist
        '413':
          description: The batch is over the configured total size
