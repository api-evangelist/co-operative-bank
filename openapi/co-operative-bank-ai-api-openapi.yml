      x-summary-source: derived
    post:
      tags:
      - AI
      operationId: doPost
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/CompletionsForm'
      responses:
        default:
          description: default response
          content:
            application/json: {}
      summary: Do post
      x-summary-source: derived
  /api/inference/v1/chat/completions:
    post:
      tags:
      - AI
      summary: Create a chat completion
      description: 'Runs one chat completion against the model the resolved site has configured, in the OpenAI-compatible request and response shape. Set "stream": true to receive the answer as server-sent events, each frame a chat.completion.chunk, closing with data: [DONE] — a stream that failed ends on an error frame and never carries that marker. The model field is required and must be one the site has configured; there is no implicit default. Every response reports the serving site in the X-dotCMS-Resolved-Site header.'
      operationId: createChatCompletion
      parameters:
      - name: siteId
        in: query
        schema:
          type: string
      requestBody:
        description: The completion to run
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequestView'
      responses:
        '200':
          description: The completion, or the event stream when stream was requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionView'
        '400':
          description: Malformed request, or one asking for something unsupported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '403':
          description: Forbidden - the caller cannot read the requested site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '404':
          description: The requested model is not configured for the resolved site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '429':
          description: Too many streamed completions are already in flight on this node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '502':
          description: The model provider failed to complete the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
  /api/inference/v1/embeddings:
    post:
      tags:
      - AI
      summary: Create embeddings
      description: Embeds text against the model the resolved site has configured for embeddings, in the OpenAI-compatible request and response shape. The input field accepts either a single string or an array of strings embedded as one batch; the response is always a list with one entry per input, each carrying the index of the input it corresponds to. An absent, null or empty input is refused, as is a blank or whitespace-only string wherever it appears, and every element of an array must be a string — arrays of token ids are not supported. The model field is required and is validated against the site's embeddings configuration, not its chat models; there is no implicit default. Every response reports the serving site in the X-dotCMS-Resolved-Site header.
      operationId: createEmbeddings
      parameters:
      - name: siteId
        in: query
        schema:
          type: string
      requestBody:
        description: What to embed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequestView'
      responses:
        '200':
          description: The vectors, one per input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingListView'
        '400':
          description: Malformed request, or one asking for something unsupported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '403':
          description: Forbidden - the caller cannot read the requested site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '404':
          description: The requested model is not configured for the resolved site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '502':
          description: The model provider failed to complete the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
  /api/inference/v1/images/generations:
    post:
      tags:
      - AI
      summary: Generate images
      description: 'Generates images against the model the resolved site has configured for images, in the OpenAI-compatible request and response shape. Every image is returned inline as b64_json: no hosted, separately-addressable artifact is created, and no url is ever returned. Both model and prompt are required, and model is validated against the site''s image configuration rather than its chat or embeddings models; there is no implicit default. The n field is honored — omitting it means one image. A value below 1, a value above the configured maximum, or any value above 1 on a site whose image model can only produce one, is refused with a 400 naming the field. The size field is passed through to the provider as a WIDTHxHEIGHT string; where the site carries an image size setting the caller''s value wins and the site''s is the default. Every response reports the serving site in the X-dotCMS-Resolved-Site header.'
      operationId: createImageGeneration
      parameters:
      - name: siteId
        in: query
        schema:
          type: string
      requestBody:
        description: What to generate
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequestView'
      responses:
        '200':
          description: The generated images, each inline as base64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationView'
        '400':
          description: Malformed request, or one asking for something unsupported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '403':
          description: Forbidden - the caller cannot read the requested site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '404':
          description: The requested model is not configured for the resolved site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '502':
          description: The model provider failed to complete the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
  /api/inference/v1/models:
    get:
      tags:
      - AI
      summary: List the models this site has configured
      description: 'Returns the models the resolved site has configured for chat, embeddings and image generation, including every entry of a chat fallback chain, in configured order with chat first — the first entry is the site''s primary chat model. Each entry reports in "type" which operation accepts it: "chat", "embedding" or "image". A name configured for more than one operation is listed once, with the type of the first of those in that order. The list is exactly the set of values this family accepts as "model": there is no implicit default and no reserved alias, and nothing synthetic is added. No model provider is contacted. A site with no AI configuration, on an instance with none at the system level either, returns an empty data array rather than another site''s models. Every response reports the serving site in the X-dotCMS-Resolved-Site header.'
      operationId: listInferenceModels
      parameters:
      - name: siteId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: The configured models, possibly none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListView'
        '400':
          description: The requested site could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
        '403':
          description: Forbidden - the caller cannot read the requested site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceErrorView'
components:
  schemas:
    ContainerUUID:
      type: object
      properties:
        identifier:
          type: string
          description: 'Reference to the Container placed in this layout slot. Accepts any ONE of three forms:

            - a Container **identifier** for a database-backed Container — a full UUID (''2cef9f97-5faf-4d18-8c9b-df22b6c17111'') or a dotCMS ''shorty'' (short) id; or

            - a **file path** for a file-based (Container-as-File) Container — host-qualified (''//demo.dotcms.com/application/containers/default/'') or host-relative (''/application/containers/default/'', resolved against the current site); or

            - the literal string ''SYSTEM_CONTAINER'' for the built-in system Container.

            The server chooses the resolution strategy by inspecting the value: a string containing ''/application/containers'' is resolved as a file-path Container, ''SYSTEM_CONTAINER'' resolves to the system Container, and anything else is looked up as a database identifier. A value that does not resolve to an existing Container produces no container at render time (the slot renders empty) rather than falling back to another Container — pass the exact identifier or the full host-qualified path.'
          example: //demo.dotcms.com/application/containers/default/
        uuid:
          type: string
        historyUUIDs:
          type: array
          items:
            type: string
    ImageGenerationRequestView:
      type: object
      properties:
        model:
          type: string
          description: Model id, as configured for this site's images
          example: dall-e-3
        prompt:
          type: string
          description: What to generate
          example: A cat in a hammock
        n:
          type: integer
          description: Number of images; at least 1, defaults to 1
          format: int32
          example: 1
        size:
          type: string
          description: Image size
          example: 1024x1024
      description: Image generation request in the OpenAI-compatible shape
    ProviderMetadata:
      type: object
      properties:
        provider:
          type: string
        supportedCapabilities:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - CHAT
            - EMBEDDINGS
            - IMAGE
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ProviderField'
    EmbeddingView:
      type: object
      properties:
        object:
          type: string
          description: Object type
          example: embedding
        index:
          type: integer
          description: Position of the input this vector embeds
          format: int32
        embedding:
          type: array
          description: The vector
          items:
            type: number
            description: The vector
            format: float
      description: One embedding
    AIImageRequestDTO:
      type: object
      properties:
        prompt:
          type: string
        numberOfImages:
          type: integer
          format: int32
        size:
          type: string
        model:
          type: string
    ToolView:
      type: object
      properties:
        type:
          type: string
        function:
          $ref: '#/components/schemas/FunctionDefView'
      description: Tools the model may call
    ChatCompletionRequestView:
      type: object
      properties:
        model:
          type: string
          description: Model id, as listed by GET /models
          example: gpt-4o
        messages:
          type: array
          description: The conversation, oldest first
          items:
            $ref: '#/components/schemas/MessageView'
        tools:
          type: array
          description: Tools the model may call
          items:
            $ref: '#/components/schemas/ToolView'
        tool_choice:
          $ref: '#/components/schemas/JsonNode'
        response_format:
          $ref: '#/components/schemas/JsonNode'
        stream:
          type: boolean
          description: Stream the answer as server-sent events
        stream_options:
          $ref: '#/components/schemas/StreamOptionsView'
        temperature:
          type: number
          description: Sampling temperature
          format: double
        max_tokens:
          type: integer
          description: Maximum tokens to generate
          format: int32
        top_p:
          type: number
          description: Nucleus sampling
          format: double
        stop:
          type: array
          description: Stop sequences
          items:
            type: string
            description: Stop sequences
        n:
          type: integer
          description: Number of choices; not supported
          format: int32
      description: Chat completion request in the OpenAI-compatible shape
    ErrorEntity:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        fieldName:
          type: string
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        totalEntries:
          type: integer
          format: int64
    FunctionCallView:
      type: object
      properties:
        name:
          type: string
        arguments:
          type: string
    CompletionsForm:
      type: object
      properties:
        prompt:
          type: string
        searchLimit:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
        searchOffset:
          minimum: 0
          type: integer
          format: int32
        responseLengthTokens:
          minimum: 128
          type: integer
          format: int32
